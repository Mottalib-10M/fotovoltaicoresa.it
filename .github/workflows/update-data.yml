# Aggiornamento mensile dei dati: prezzi del ritiro dedicato GSE (pubblicati entro il 22 del mese successivo)
# e controllo delle fonti ARERA. Se un dato cambia, i test devono passare prima del commit.
name: Aggiornamento dati

on:
  schedule:
    - cron: '0 6 25 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: npm ci --legacy-peer-deps
      - run: node scripts/update-data.mjs
      - run: npx vitest run
      - run: npm run build
      - name: Commit se i dati sono cambiati
        run: |
          if ! git diff --quiet -- src/data; then
            git config user.name "Radif Partners"
            git config user.email "amradif@gmail.com"
            git add src/data
            git commit -m "Dati: prezzi del ritiro dedicato GSE aggiornati"
            git push
          fi
